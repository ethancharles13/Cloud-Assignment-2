alertmanager:
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: 'Webhook here
      #Github considers the webhook to be a secret
      #and won't allow pushes with it included.
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h
      receiver: 'slack-notifications'

    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - channel: '#all-assignment2notifications'
        title: 'Prometheus Alert'
        text: '{{ range .Alerts }}*Alert:* {{ .Labels.alertname }} - {{ .Annotations.summary }}\n*Description:* {{ .Annotations.description }}\n{{ end }}'